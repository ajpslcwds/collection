<?xml version="1.0" encoding="gb2312"?>
<LogConf ChkCfgMdfyPeriod="5">
  <!-- ChkCfgMdfyPeriod表示每隔多长时间检查一下配置文件的更改，不设置时默认10s -->
  <!-- 日志级别由高到低分别为：CRITICAL ERROR WARNING INFO DEBUG TRACE-->
  <!-- 日志名称与日志文件名同步，大小写敏感 -->
  <!-- Async="1"表示异步写入日志 Async="0"表示同步写入日志, 如果省略, 默认为异步 -->
  <!--SaveDays表示按天保存日志文件，并保存多少天, 当设置SaveDays>0时，FileMaxKb与FileMaxNo失效-->
  <General CurrentLogLV="INFO" SaveDays="0" FileMaxKb="200000" FileMaxNo="5" LogOnMonitor="0" Async="1" />

  <!-- application -->
  <codesysdrv CurrentLogLV="INFO" SaveDays="2" FileMaxKb="200000" FileMaxNo="5" LogOnMonitor="0" Async="1" />
  <demo CurrentLogLV="DEBUG" SaveDays="0" FileMaxKb="2000" FileMaxNo="5" LogOnMonitor="0" Async="1" />
</LogConf>
